[project]
name = "possession"
version = "0.1.0"
description = "Frame-level football possession from automatic tracking"
authors = [{ name = "Dev Bhatt" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.1",
    "httpx>=0.28.1",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "pandas>=2.2",
    "pillow>=13.0.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "typer>=0.12",
]

[project.scripts]
possession = "possession.cli:app"

[dependency-groups]
detectors = [
    "moondream>=2.6.1",
]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

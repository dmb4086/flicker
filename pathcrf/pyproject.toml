[project]
name = "pathcrf-inference-env"
version = "0.0.0"
description = "Pinned CPU environment for the path model (not a package)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torch-geometric==2.8.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "tqdm==4.70.1",
    "kloppy==3.19.1",
    "rdp==0.8",
    "pyarrow==26.0.0",
    "lxml==6.1.3",
    "matplotlib==3.11.2",
]

[tool.uv]
package = false

# CPU-only torch: macOS wheels on PyPI are CPU builds; on Linux PyPI would pull CUDA, so use the CPU index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
